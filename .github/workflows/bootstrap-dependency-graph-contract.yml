name: bootstrap dependency graph contract

# Test-org-only bootstrap. It formats the hand-written Rust contract and
# commits the schema generated by the pinned toolchain. Remove this workflow
# from the branch before promotion to zed-pkg/zed-interfaces.
on:
  push:
    branches: [agent/dependency-graph-contract-v1]

permissions:
  contents: write

concurrency:
  group: bootstrap-dependency-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[generated-contract]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out test branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/dependency-graph-contract-v1
          persist-credentials: true
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      # The first isolated compile proved serde_json::Error cannot be embedded
      # in an Eq-derived public error contract. Apply the narrow source repair
      # here so the test bot commits the reviewed, formatted result.
      - name: Apply compile repair discovered by test run
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/rust/dependency_graph.rs")
          source = path.read_text()
          old = '''    #[error("dependency graph JSON serialization failed: {0}")]
              Json(#[from] serde_json::Error),
          }
          '''
          new = '''    #[error("dependency graph JSON serialization failed: {0}")]
              Json(String),
          }

          impl From<serde_json::Error> for DependencyGraphError {
              fn from(error: serde_json::Error) -> Self {
                  Self::Json(error.to_string())
              }
          }
          '''
          if old not in source:
              raise SystemExit("expected serde_json error variant was not found")
          path.write_text(source.replace(old, new, 1))

      - name: Format and test focused contract
        run: |
          cargo fmt
          cargo test --locked dependency_graph

      - name: Generate JSON Schemas
        run: cargo run --locked --example generate_schemas

      - name: Commit deterministic generated output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zed-pkg-test contract bot"
          git config user.email "zed-pkg-test-contract-bot@users.noreply.github.com"
          git add src/rust schemas
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "generate dependency graph contract [generated-contract]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
