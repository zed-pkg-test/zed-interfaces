name: Clean polyglot post-DEN-2998 certification

on:
  pull_request:
    paths:
      - .github/workflows/clean-polyglot-post-den-2998.yml

permissions:
  contents: read

concurrency:
  group: den-2990-post-den-2998-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  PRODUCT_REF: 0e53be69baf6134379138a50e52064dff07ff346
  UNION_REF: 85613d5ff7c2e397688d88d186d950009390d3fd
  PREVIOUS_UNION: a9f747c6e1be1b5aba043cb81831e07b5d13df4b
  BASE_MAIN: a8aa3f944e267e3a49f207aad2be83ef000ab9b1
  CURRENT_VERSION_BLOB: 11217f77487b1a9d357a7859a0ded6613ecd60e0
  CURRENT_ENVIRONMENT_LOCK_BLOB: 6e048314d43fed763f15435bebbcb959a6a4bd19
  NATIVE_REGISTRY_WORKFLOW_BLOB: 6e6d9fad649d7056eef887c77894aecc2193a257
  PORTABLE_PATH_TEST: environment_lock::tests::unsafe_install_paths_are_rejected_cross_platform
  CARGO_TERM_COLOR: always

jobs:
  rust-integration:
    name: Current-main Rust union / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux
          - os: windows-2025
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out certification repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cert
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact product candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.PRODUCT_REF }}
          path: product
          fetch-depth: 12
          persist-credentials: false
          show-progress: false

      - name: Verify exact semantic union, follow-up, and inherited blobs
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_REF"
          test "$(git -C product merge-base "$BASE_MAIN" "$PRODUCT_REF")" = "$BASE_MAIN"
          test "$(git -C product show -s --format=%P "$PRODUCT_REF")" = "$UNION_REF"
          test "$(git -C product show -s --format=%P "$UNION_REF")" = "$PREVIOUS_UNION $BASE_MAIN"
          test "$(git -C product hash-object src/rust/version.rs)" = "$CURRENT_VERSION_BLOB"
          test "$(git -C product hash-object src/rust/environment_lock.rs)" = "$CURRENT_ENVIRONMENT_LOCK_BLOB"
          test "$(git -C product hash-object .github/workflows/native-registry.yml)" = "$NATIVE_REGISTRY_WORKFLOW_BLOB"
          test ! -e product/src/environment_lock.rs
          test ! -e product/.github/workflows/den-2735-materialize.yml
          if grep -F 'src/rust/src/rust' product/.github/workflows/native-registry.yml; then
            echo 'native registry workflow contains a duplicated Rust source path' >&2
            exit 1
          fi
          grep -F 'src/rust/examples/generate_schemas.rs' product/.github/workflows/native-registry.yml
          grep -F 'src/rust/tests/native_registry_schema_contract.rs' product/.github/workflows/native-registry.yml
          grep -F 'git diff --cached --exit-code' product/.github/workflows/native-registry.yml
          grep -F 'git ls-files --others --exclude-standard' product/.github/workflows/native-registry.yml
          if git -C product diff --name-only "$BASE_MAIN..$PRODUCT_REF" | grep -Eq '^(\.claude/|\.gemini/|\.openai/)'; then
            echo 'candidate introduces snapshot/agent-history paths' >&2
            exit 1
          fi

      - name: Install stable Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Verify workspace topology and canonical root identity
        working-directory: product
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version=1 --no-deps > "$RUNNER_TEMP/metadata.json"
          python - "$RUNNER_TEMP/metadata.json" <<'PY'
          import json
          import pathlib
          import sys
          import tomllib

          metadata = json.loads(pathlib.Path(sys.argv[1]).read_text())
          packages = [p for p in metadata["packages"] if p["name"] == "zed-interfaces"]
          assert len(packages) == 1, packages
          assert packages[0]["manifest_path"].replace("\\", "/").endswith("/src/rust/Cargo.toml")
          manifest = tomllib.loads(pathlib.Path(".zpkg.toml").read_text())
          repository = manifest["targets"]["repository"]
          assert repository["dir"] == "." and "name" not in repository, repository
          PY
          test -f src/rust/dependency_graph.rs
          test -f src/rust/tests/root_target_identity.rs
          test -f src/rust/tests/own_manifest.rs
          ! grep -F 'name = "zed-interfaces-repository"' .zpkg.toml

      - name: Formatting
        working-directory: product
        run: cargo fmt --all --check

      - name: Strict Clippy
        working-directory: product
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Full Rust suite without baseline exclusions
        working-directory: product
        run: cargo test --workspace --locked

      - name: Explicitly certify the portable path repair
        working-directory: product
        run: cargo test --locked "$PORTABLE_PATH_TEST" -- --exact --nocapture

      - name: Certify native-registry clean-tree logic on this host
        working-directory: product
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          cargo run --locked --example generate_schemas
          git diff --exit-code -- schemas fixtures
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Doctests and moved regressions
        working-directory: product
        run: |
          set -euo pipefail
          cargo test --workspace --locked --doc
          cargo test --locked --test own_manifest -- --nocapture
          cargo test --locked --test root_target_identity -- --nocapture
          cargo test --locked dependency_graph -- --nocapture
          cargo test --locked requirement_validation_rejects_malformed_dotted_ranges_only -- --exact --nocapture

  polyglot-integration:
    name: Current-main generated slices / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out certification repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cert
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact product candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.PRODUCT_REF }}
          path: product
          fetch-depth: 12
          persist-credentials: false
          show-progress: false

      - name: Verify exact current-main integration
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_REF"
          test "$(git -C product merge-base "$BASE_MAIN" "$PRODUCT_REF")" = "$BASE_MAIN"
          test "$(git -C product show -s --format=%P "$PRODUCT_REF")" = "$UNION_REF"
          test "$(git -C product show -s --format=%P "$UNION_REF")" = "$PREVIOUS_UNION $BASE_MAIN"
          test "$(git -C product hash-object src/rust/version.rs)" = "$CURRENT_VERSION_BLOB"
          test "$(git -C product hash-object src/rust/environment_lock.rs)" = "$CURRENT_ENVIRONMENT_LOCK_BLOB"
          test "$(git -C product hash-object .github/workflows/native-registry.yml)" = "$NATIVE_REGISTRY_WORKFLOW_BLOB"

      - name: Install stable Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Dart SDK
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1

      - name: Prove schema classification and generated-output drift
        working-directory: product
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib

          root = pathlib.Path("schemas")
          index = json.loads((root / "index.json").read_text())
          files = {p.name for p in root.glob("*.json") if p.name != "index.json"}
          indexed = {entry["file"] for entry in index["schemas"]}
          assert files == indexed, (files - indexed, indexed - files)
          assert "dependency-graph-v1.json" in indexed
          for entry in index["schemas"]:
              assert isinstance(entry.get("targets"), list)
              assert entry.get("why", "").strip()
          PY
          cargo run --locked --example generate_schemas
          cargo run --locked --example generate_fixtures
          node --test codegen/generate.test.mjs
          node codegen/generate.mjs --check
          git diff --exit-code -- schemas fixtures src/dart src/ts

      - name: Dart runtime contract
        working-directory: product/src/dart
        run: |
          set -euo pipefail
          dart pub get
          dart analyze --fatal-infos
          dart test

      - name: TypeScript runtime contract
        working-directory: product/src/ts
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false typescript@5 @types/node
          npx tsc --noEmit
          node --test wire-format.test.ts

      - name: Second-pass stability
        working-directory: product
        run: |
          set -euo pipefail
          cargo run --locked --example generate_schemas
          cargo run --locked --example generate_fixtures
          node codegen/generate.mjs --check
          git diff --exit-code -- schemas fixtures src/dart src/ts

  policy:
    name: Read-only certification policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out certification repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Enforce credential-free workflow contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/clean-polyglot-post-den-2998.yml
          grep -F 'permissions:' "$workflow"
          grep -F 'contents: read' "$workflow"
          test "$(grep -c 'persist-credentials: false' "$workflow")" -ge 3
          python - "$workflow" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text().lower()
          banned = (
              "secrets" + ".",
              "github" + ".token",
              "gh" + "_token",
              "github" + "_token",
              "cloud" + "flare",
              "r2" + "_access",
              "linear" + "_api",
          )
          found = [token for token in banned if token in text]
          assert not found, found
          PY
