name: Clean polyglot current-main integration certification

on:
  pull_request:
    paths:
      - .github/workflows/clean-polyglot-current-main-integration.yml

permissions:
  contents: read

concurrency:
  group: den-2990-final-integration-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  PRODUCT_REF: a9f747c6e1be1b5aba043cb81831e07b5d13df4b
  BASE_MAIN: 5f915e19bee6e1bbd45a90fe3190d4eaa6b539ba
  CURRENT_VERSION_BLOB: 11217f77487b1a9d357a7859a0ded6613ecd60e0
  KNOWN_WINDOWS_BASELINE_TEST: environment_lock::tests::unsafe_install_paths_are_rejected_cross_platform
  CARGO_TERM_COLOR: always

jobs:
  rust-integration:
    name: Current-main Rust union / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux
          - os: windows-2025
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out certification repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cert
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact product union
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.PRODUCT_REF }}
          path: product
          fetch-depth: 4
          persist-credentials: false
          show-progress: false

      - name: Check out current canonical base
        if: matrix.label == 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.BASE_MAIN }}
          path: baseline
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact semantic union and provenance
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_REF"
          test "$(git -C product merge-base "$BASE_MAIN" "$PRODUCT_REF")" = "$BASE_MAIN"
          test "$(git -C product hash-object src/rust/version.rs)" = "$CURRENT_VERSION_BLOB"
          if git -C product diff --name-only "$BASE_MAIN..$PRODUCT_REF" | grep -Eq '^(\.claude/|\.gemini/|\.openai/)'; then
            echo 'union introduces snapshot/agent-history paths' >&2
            exit 1
          fi
          test ! -e product/.github/workflows/den-2735-materialize.yml

      - name: Install stable Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Prove known Windows path defect remains a current-main baseline defect
        if: matrix.label == 'Windows'
        working-directory: baseline
        run: |
          set -uo pipefail
          set +e
          cargo test --locked "$KNOWN_WINDOWS_BASELINE_TEST" -- --exact --nocapture > "$RUNNER_TEMP/base-path.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/base-path.log"
          test "$status" -ne 0
          grep -F "$KNOWN_WINDOWS_BASELINE_TEST" "$RUNNER_TEMP/base-path.log"

      - name: Verify workspace topology and canonical root identity
        working-directory: product
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version=1 --no-deps > "$RUNNER_TEMP/metadata.json"
          python - "$RUNNER_TEMP/metadata.json" <<'PY'
          import json, pathlib, sys, tomllib
          metadata = json.loads(pathlib.Path(sys.argv[1]).read_text())
          packages = [p for p in metadata['packages'] if p['name'] == 'zed-interfaces']
          assert len(packages) == 1, packages
          assert packages[0]['manifest_path'].replace('\\', '/').endswith('/src/rust/Cargo.toml')
          manifest = tomllib.loads(pathlib.Path('.zpkg.toml').read_text())
          repo = manifest['targets']['repository']
          assert repo['dir'] == '.' and 'name' not in repo, repo
          PY
          test -f src/rust/dependency_graph.rs
          test -f src/rust/tests/root_target_identity.rs
          test -f src/rust/tests/own_manifest.rs
          ! grep -F 'name = "zed-interfaces-repository"' .zpkg.toml

      - name: Formatting
        working-directory: product
        run: cargo fmt --all --check

      - name: Strict Clippy
        working-directory: product
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Full Rust suite with only proven Windows baseline defect excluded
        working-directory: product
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cargo test --workspace --locked -- --skip "$KNOWN_WINDOWS_BASELINE_TEST"
          else
            cargo test --workspace --locked
          fi

      - name: Prove union has the same known Windows baseline defect
        if: matrix.label == 'Windows'
        working-directory: product
        run: |
          set -uo pipefail
          set +e
          cargo test --locked "$KNOWN_WINDOWS_BASELINE_TEST" -- --exact --nocapture > "$RUNNER_TEMP/union-path.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/union-path.log"
          test "$status" -ne 0
          grep -F "$KNOWN_WINDOWS_BASELINE_TEST" "$RUNNER_TEMP/union-path.log"

      - name: Doctests and explicit moved regressions
        working-directory: product
        run: |
          set -euo pipefail
          cargo test --workspace --locked --doc
          cargo test --locked --test own_manifest -- --nocapture
          cargo test --locked --test root_target_identity -- --nocapture
          cargo test --locked dependency_graph -- --nocapture
          cargo test --locked requirement_validation_rejects_malformed_dotted_ranges_only -- --exact --nocapture

  polyglot-integration:
    name: Current-main generated slices / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out certification repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cert
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact product union
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.PRODUCT_REF }}
          path: product
          fetch-depth: 4
          persist-credentials: false
          show-progress: false

      - name: Verify exact current-main integration
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_REF"
          test "$(git -C product merge-base "$BASE_MAIN" "$PRODUCT_REF")" = "$BASE_MAIN"
          test "$(git -C product hash-object src/rust/version.rs)" = "$CURRENT_VERSION_BLOB"

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Dart SDK
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1

      - name: Prove schema classification and generated-output drift
        working-directory: product
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('schemas')
          index = json.loads((root / 'index.json').read_text())
          files = {p.name for p in root.glob('*.json') if p.name != 'index.json'}
          indexed = {entry['file'] for entry in index['schemas']}
          assert files == indexed, (files - indexed, indexed - files)
          assert 'dependency-graph-v1.json' in indexed
          for entry in index['schemas']:
              assert isinstance(entry.get('targets'), list)
              assert entry.get('why', '').strip()
          PY
          cargo run --locked --example generate_schemas
          cargo run --locked --example generate_fixtures
          node --test codegen/generate.test.mjs
          node codegen/generate.mjs --check
          git diff --exit-code -- schemas fixtures src/dart src/ts

      - name: Dart runtime contract
        working-directory: product/src/dart
        run: |
          set -euo pipefail
          dart pub get
          dart analyze --fatal-infos
          dart test

      - name: TypeScript runtime contract
        working-directory: product/src/ts
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false typescript@5 @types/node
          npx tsc --noEmit
          node --test wire-format.test.ts

      - name: Second-pass stability
        working-directory: product
        run: |
          set -euo pipefail
          cargo run --locked --example generate_schemas
          cargo run --locked --example generate_fixtures
          node codegen/generate.mjs --check
          git diff --exit-code -- schemas fixtures src/dart src/ts
